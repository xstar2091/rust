[workspace]
resolver = "1"
members = ["crates/*", "apps/*"]

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.54.0", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "chrono"] }

sim-common = { path = "crates/sim-common" }
sim-utils = { path = "crates/sim-utils" }
